
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Webcam Mirror</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #101318;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main { max-width: 850px; margin: auto; }
    #stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #050608;
      overflow: hidden;
      border-radius: 12px;
      display: grid;
      place-items: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: none;
    }
    button {
      margin: 16px 5px;
      padding: 12px 20px;
      cursor: pointer;
    }
    #status { margin: 16px 0; }
    #error {
      color: #ff9e9e;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h1>Webcam Mirror</h1>
    <p id="status">Camera is off</p>

    <div id="stage">
      <video id="video" autoplay muted playsinline></video>
      <p id="placeholder">Your camera preview will appear here.</p>
    </div>

    <button id="start">Start Camera</button>
    <button id="stop" disabled>Stop Camera</button>

    <p id="error" role="alert"></p>
  </main>

  <script>
    const video = document.getElementById("video");
    const status = document.getElementById("status");
    const error = document.getElementById("error");
    const placeholder = document.getElementById("placeholder");
    const start = document.getElementById("start");
    const stop = document.getElementById("stop");

    let stream = null;

    start.addEventListener("click", async () => {
      error.textContent = "";
      status.textContent = "Requesting camera access...";
      start.disabled = true;

      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error(
            "Camera API unavailable. Open this page directly using HTTPS."
          );
        }

        stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        video.style.display = "block";
        placeholder.style.display = "none";
        status.textContent = "Camera is running!";
        stop.disabled = false;
      } catch (e) {
        status.textContent = "Camera could not start.";
        error.textContent = e.name + ": " + e.message;
        console.error(e);
        start.disabled = false;
      }
    });

    stop.addEventListener("click", () => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }

      stream = null;
      video.srcObject = null;
      video.style.display = "none";
      placeholder.style.display = "block";
      status.textContent = "Camera is off";
      error.textContent = "";
      start.disabled = false;
      stop.disabled = true;
    });
  </script>
</body>
</html>
