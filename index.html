<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webcam Mirror</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    header {
      margin-bottom: 1.5rem;
      text-align: center;
    }

    h1 {
      font-size: 1.875rem;
      font-weight: 700;
      color: var(--text-color);
    }

    p.subtitle {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-top: 0.25rem;
    }

    .viewport-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: none;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      color: #64748b;
      text-align: center;
      padding: 1rem;
    }

    .btn {
      background-color: var(--accent-color);
      color: #0f172a;
      font-weight: 600;
      padding: 0.625rem 1.25rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:hover {
      background-color: #7dd3fc;
    }

    .btn:active {
      transform: scale(0.98);
    }
  </style>

  <!-- MediaPipe dependencies (ready for un-commenting when you add landmarks later) -->
  <!-- 
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  -->
</head>
<body>

  <header>
    <h1>Webcam Mirror</h1>
    <p class="subtitle">Cloudflare Worker Static Assets App</p>
  </header>

  <div class="viewport-container" id="viewport">
    <div class="placeholder" id="placeholder">
      <p>Camera permission required to mirror video</p>
      <button class="btn" id="startBtn">Start Camera</button>
    </div>

    <!-- Hidden raw video element -->
    <video id="webcam" autoplay playsinline muted></video>

    <!-- Canvas for rendering mirror feed & future MediaPipe landmarks -->
    <canvas id="output_canvas"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const placeholder = document.getElementById('placeholder');

    let isStreaming = false;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: 'user'
          },
          audio: false
        });

        videoElement.srcObject = stream;
        await videoElement.play();

        placeholder.style.display = 'none';
        isStreaming = true;

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        requestAnimationFrame(renderLoop);
      } catch (err) {
        console.error('Error accessing webcam:', err);
        alert('Could not access webcam. Please check browser permissions.');
      }
    }

    function resizeCanvas() {
      if (videoElement.videoWidth && videoElement.videoHeight) {
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
      }
    }

    function renderLoop() {
      if (!isStreaming) return;

      if (canvasElement.width !== videoElement.videoWidth) {
        resizeCanvas();
      }

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);

      // ==============================================================
      // FUTURE MEDIAPIPE LANDMARK DRAWING GOES HERE
      // ==============================================================

      canvasCtx.restore();

      requestAnimationFrame(renderLoop);
    }

    startBtn.addEventListener('click', startCamera);
  </script>
</body>
</html>
